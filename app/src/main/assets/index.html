<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>ECharts</title>
  <style>
    body {
      background-color: #000000;
      /* 黑色背景 */
      color: #fff;
      /* 文本颜色为白色 */
    }
  </style>
  <!-- 引入刚刚下载的 ECharts 文件 -->
  <script src="js/echarts.js"></script>
</head>

<body>
  <!-- 为 ECharts 准备一个定义了宽高的 DOM -->
  <div id="main" style="width: 90vw;height:50vw;"></div>
  <script type="text/javascript">
    // 基于准备好的dom，初始化echarts实例
    var myChart = echarts.init(document.getElementById('main'), 'dark');

    // 计算sin函数值的函数
    function func(x) {
      return Math.sin(x);
    }

    // 生成数据  
    function generateSinData() {
      let data = [];
      let period = 360;//周期
      for (let i = 0; i <= period; i += 1) {
        data.push([i, func(i / (period/2) * Math.PI)]); // 将角度转换为弧度  
      }
      return data;
    }

    function generateZero() {
      let data = [];
      let period = 360;//周期
      for (let i = 0; i <= period; i += 1) {
        data.push([i, 0]); // 将角度转换为弧度
      }
      return data;
    }

    var option = {
      animation: false, // 禁用全局动画  
      xAxis: {
        type: 'value',
        min: 0,
        max: 50,
        axisTick: {
          show: false // 坐标轴刻度线，设置为false则不显示
        },
        axisLabel: {
          show: false // 坐标轴刻度标签，设置为false则不显示数字  
        },
        splitLine: {
          show: true // 网格线，设置为false则不显示
        }
      },
      yAxis: {
        type: 'value',
        min: -127,
        max: 127,
        axisTick: {
          show: false // 坐标轴刻度线，设置为false则不显示  
        },
        axisLabel: {
          show: false // 坐标轴刻度标签，设置为false则不显示数字  
        },
        splitLine: {
          show: true // 网格线，设置为false则不显示
        }
      },
      dataset: {
        source: generateZero()
      },
      series: [{
        type: 'line',
        smooth: true, // 曲线平滑  
        encode: {
          x: 0, // 映射数据集的第一个维度到 x 轴  
          y: 1  // 映射数据集的第二个维度到 y 轴  
        }
      }]
    };
    myChart.setOption(option);

    function accept(data) {
      tmpstr = JSON.stringify(data);
      console.log(tmpstr);
      // splitArr对象中保存的就是传递过来的数组
      splitArr = JSON.parse(tmpstr.substring(1, tmpstr.length - 1))
      console.log(splitArr);

      let res = [];
      for(let i = 0; i < splitArr.length; i++) {
        res.push([i,splitArr[i]]);
      }
      console.log(res);  // 打印出处理后的数据
      option.dataset.source = res;
      myChart.setOption(option);
    }
  </script>
</body>

</html>
